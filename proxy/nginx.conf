user  nginx;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_buffer_size 10m;
    client_max_body_size 2G;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream fastapi {
        least_conn;
        server backend_0:8000 max_fails=3 fail_timeout=20s;
        server backend_1:8000 max_fails=3 fail_timeout=20s;
    }
    server {
        listen 8002 ssl;
        server_name 0.0.0.0;

        ssl_certificate /etc/nginx/ssl/private.pem;
        ssl_certificate_key /etc/nginx/ssl/private-key.pem;

        location / {
            proxy_pass         http://fastapi;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering    off;
        }

        location /ws {
            proxy_pass http://fastapi/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 443 ssl;
        server_name 0.0.0.0;

        ssl_certificate /etc/nginx/ssl/private.pem;
        ssl_certificate_key /etc/nginx/ssl/private-key.pem;

        location / {
            proxy_pass         http://frontend:3000;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering    off;
        }

        location /_next/webpack-hmr {
            proxy_pass http://frontend:3000/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
    server {
        listen 9000 ssl;
        server_name 0.0.0.0;

        ssl_certificate /etc/nginx/ssl/private.pem;
        ssl_certificate_key /etc/nginx/ssl/private-key.pem;

        ignore_invalid_headers off;
        client_max_body_size 0;
        
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            proxy_pass http://minio:9000;
        }
    }

    
}