name: Build and Deploy to EC2 via Docker Hub

on:
  push:
    branches: ["main"]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/my-app-backend
  DEPLOY_DIR: /home/${{ secrets.EC2_USER }}/app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/production.Dockerfile
          tags: |
            dnk3500/ping_frontend:latest
            dnk3500/ping_frontend:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/production.Dockerfile
          tags: |
            dnk3500/ping_backend:latest
            dnk3500/ping_backend:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (for compose files)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ env.DEPLOY_DIR }}

      # EC2 원격 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_IMAGE
          script: |
            cd ${{ env.DEPLOY_DIR }}

            # (선택) .env 파일이 필요한 경우 생성
            # echo "${{ secrets.ENV_VARS }}" > .env

            # Docker Hub 로그인 (Private Repo인 경우 필수)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 최신 이미지 Pull 및 재실행
            docker compose -f docker-compose.overrid.yml pull
            docker compose -f docker-compose.overrid.yml up -d --remove-orphans

            # 사용하지 않는 이전 이미지 정리
            docker image prune -f
